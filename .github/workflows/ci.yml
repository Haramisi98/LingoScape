name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and release validation (${{ matrix.runelite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runelite: [pinned, plugin-hub]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve Plugin Hub RuneLite version
        if: matrix.runelite == 'plugin-hub'
        shell: bash
        run: |
          version=$(curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/runelite/plugin-hub/master/runelite.version | tr -d '\r\n')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]
          echo "ORG_GRADLE_PROJECT_runeLiteVersion=$version" >> "$GITHUB_ENV"
          echo "Plugin Hub RuneLite version: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Build, Java tests, translation validation, and packaging
        run: bash ./gradlew clean build shadowJar releaseJar --no-daemon --console=plain
      - name: Validate release JAR contents
        run: python tools/validate_release.py
      - name: Build and smoke-test the actual Plugin Hub artifact
        if: matrix.runelite == 'plugin-hub'
        run: python tools/validate_plugin_hub.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.runelite }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runelite }}
          path: |
            build/libs/*-release.jar
            build/plugin-hub/plugin.jar
          if-no-files-found: error

  collector:
    name: Collector and artifact validator tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tools -p "test_*.py"
