plugins {
	id 'java'
}

repositories {
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Override with -PruneLiteVersion=<version> when testing a newer RuneLite release.
def runeLiteVersion = providers.gradleProperty('runeLiteVersion').getOrElse('1.13.1')
def pluginMainClass = 'com.haramisi98.LingoScape.LingoScapeLauncher'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.1'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
	testImplementation 'org.mockito:mockito-core:5.4.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

tasks.test {
	useJUnitPlatform() // Required for JUnit 5
}

group = 'com'
apply from: 'gradle/translations.gradle'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Launch RuneLite with LingoScape available as a development plugin.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	jvmArgs '-ea'
	args '--developer-mode', '--debug'
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.test.output
	from sourceSets.main.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// Load production classes/resources from the artifact, never loose main/test output.
sourceSets {
	artifactSmoke {
		java.srcDir 'tools/artifact-smoke'
		compileClasspath = files(providers.gradleProperty('pluginArtifact')) + configurations.testRuntimeClasspath
	}
}
tasks.register('smokeTestArtifact', JavaExec) {
	dependsOn tasks.named('artifactSmokeClasses')
	def artifact = providers.gradleProperty('pluginArtifact')
	classpath = sourceSets.artifactSmoke.output + files(artifact) + configurations.testRuntimeClasspath
	mainClass = 'com.haramisi98.LingoScape.ArtifactSmoke'
	args layout.projectDirectory.asFile.absolutePath
	doFirst {
		if (!file(artifact.get()).isFile()) throw new GradleException('Pass -PpluginArtifact=<built plugin JAR>')
	}
}
